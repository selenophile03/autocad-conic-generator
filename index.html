<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Conic Section CAD Generator</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://tailwindcss.com"></script>
    <!-- Browser-ready DXF Engine -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
        <h1 class="text-xl font-bold text-cyan-400 mb-1">📐 Conic Section Generator</h1>
        <p class="text-xs text-slate-400 mb-6">Generate mathematical curves directly into native AutoCAD layers.</p>

        <div class="space-y-4">
            <!-- Curve Selector Dropdown -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Select Conic Type</label>
                <select id="conicType" class="w-full bg-slate-950 border border-slate-700 rounded p-2 focus:outline-none focus:border-cyan-400 text-cyan-300">
                    <option value="ellipse">Ellipse (e = 0.7)</option>
                    <option value="parabola">Parabola (e = 1.0)</option>
                    <option value="hyperbola">Hyperbola (e = 1.5)</option>
                </select>
            </div>

            <!-- Parametric Dimension Scale Slider -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Focal Parameter / Scale (mm)</label>
                <input type="range" id="scaleParam" min="20" max="100" value="50" class="w-full accent-cyan-400">
                <span id="scaleVal" class="text-xs text-cyan-300 font-mono">50mm</span>
            </div>

            <!-- Resolution Slider -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Plot Precision (Points)</label>
                <input type="range" id="resolutionParam" min="50" max="500" value="200" class="w-full accent-cyan-400">
                <span id="resVal" class="text-xs text-cyan-300 font-mono">200 points</span>
            </div>

            <!-- Trigger Button -->
            <button id="exportBtn" class="w-full mt-4 bg-cyan-400 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-cyan-500/20">
                🚀 Compile & Download DXF
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
